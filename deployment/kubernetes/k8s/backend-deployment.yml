apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soc-backend
  template:
    metadata:
      labels:
        app: soc-backend
    spec:
      containers:
      - name: backend
        image: soc-backend:latest
        ports:
        - containerPort: 8000