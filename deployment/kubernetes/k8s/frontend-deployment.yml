apiVersion: apps/v1
kind: Deployment
metadata:
  name: soc-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soc-frontend
  template:
    metadata:
      labels:
        app: soc-frontend
    spec:
      containers:
      - name: frontend
        image: soc-frontend:latest
        ports:
        - containerPort: 3000